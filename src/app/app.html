@if(isAdminLoggedIn){
  <nz-header class="main-header" nz-row nzType="flex" class="custom-navbar">
    <div class="navbar-title">
        <a routerLink="/login">Interfaccia Amministratore</a>
    </div>
    <div class="nav-links">
      <a nz-button nzType="link" routerLink="/admin/dashboard" routerLinkActive="active">Dashboard Admin</a>
      <a nz-button nzType="link" routerLink="/admin/car" routerLinkActive="active">Aggiungi auto</a>
      <a nz-button nzType="link" routerLink="/admin/bookings" routerLinkActive="active">Prenotazioni</a>
      <a nz-button nzType="link" routerLink="/admin/search" routerLinkActive="active">Cerca auto</a>
      <a nz-button nzType="link" (click)="logout()" routerLinkActive="active">Logout</a>
    </div>
  </nz-header>
}

@else if (isCustomerLoggedIn) {
  <nz-header class="main-header" nz-row nzType="flex" class="custom-navbar">
    <div class="navbar-title">
        <a routerLink="/login">Interfaccia Cliente</a>
    </div>
    <div class="nav-links">
      <a nz-button nzType="link" routerLink="/customer/dashboard" routerLinkActive="active">Dashboard Customer</a>
      <a nz-button nzType="link" routerLink="/customer/my_bookings" routerLinkActive="active">Le mie prenotazioni</a>
      <a nz-button nzType="link" routerLink="/customer/car/search" routerLinkActive="active">Cerca auto</a>
      <a nz-button nzType="link" (click)="logout()" routerLinkActive="active">Logout</a>
    </div>
  </nz-header>
}

@else {
  <nz-header class="main-header" nz-row nzType="flex" class="custom-navbar">
    <div class="navbar-title">
        <a routerLink="/login">Car Rental Service</a>
    </div>
    <div class="nav-links">
      <a nz-button nzType="link" routerLink="/register" routerLinkActive="active">Registrazione</a>
      <a nz-button nzType="link" routerLink="/login" routerLinkActive="active">Login</a>
    </div>
  </nz-header>
}

<router-outlet></router-outlet>
